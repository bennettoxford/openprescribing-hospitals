name: Ready-to-administer pre-filled syringes
description: |
    [Lord Carter's Transforming NHS Pharmacy Aseptic Services in England review](https://assets.publishing.service.gov.uk/media/5f9afdbdd3bf7f1e405d9a23/aseptic-pharmacy.pdf) highlighted the need to expand the use of licensed ready-to-administer products. These products offer a safer and more efficient alternative to products that require preparation before use. These measures show the percentage of each medicine that hospitals issue as an ampoule rather than as a ready-to-administer pre-filled syringe.
