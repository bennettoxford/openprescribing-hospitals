name: Safer potassium injectables # Full name of the measure/indicator
short_name: Safer potassium injectables # Abbreviated name or acronym
description: Percentage of potassium chloride or potassium dihydrogen phosphate injectable unit doses (>80mmol/L) supplied in non-ready diluted presentations (20ml or less) # Brief 1-2 sentence description of what this measure identifies
why_it_matters: |  
  Concentrated potassium solutions are high risk medicines which, if administered incorrectly, can cause potentially fatal arrhythmias and cardiac arrest. 

  A [patient safety alert - Potassium solutions: risks to patients from errors occurring during intravenous administration](https://webarchive.nationalarchives.gov.uk/ukgwa/20171030131025/http://www.nrls.npsa.nhs.uk/resources/?entryid45=59882&cord=ASC) was first published in 2002 with the aim of reducing the risk of accidental overdose of intravenous potassium arising from the use of potassium chloride concentrate solutions and other strong potassium solutions. More recent [Specialist Pharmacy Service guidance](https://sps.nhs.uk/articles/hypokalaemia/) reiterates this risk. Both recommend the use of commercially available ready-to-use diluted potassium solutions wherever possible to reduce the risk of fatalities from potassium overdose. 

  The safety alert is considered one of the [NHS England *Enduring Standards*](https://www.england.nhs.uk/patient-safety/patient-safety-insight/patient-safety-alerts/enduring-standards/standards-that-remain-valid/) for Safe Storage of Medicines. The enduring standards are specific actions from previous patient safety alerts identified as likely to always be relevant or unlikely to change in the immediate future. They represent actions that should be embedded systematically across NHS provider organisations.

how_is_it_calculated: |
  This measure focuses on injectable products containing potassium chloride or potassium dihydrogen phosphate with a strength greater than 80 mmol/L. The threshold of >80 mmol/L is based on the previous Royal Pharmaceutical Society benchmarking metric for the safer use of intravenous potassium salts.

  For the purposes of this measure, we define non-ready diluted products as those supplied in a total volume of 20 ml or less.

  We include both licensed and unlicensed products in the measure, as the focus is on the use of ready-diluted compared with non-ready-diluted products rather than their licensing status.

  We divide the number of doses of included injectable potassium products supplied as non-ready diluted products by the total number of included injectable potassium doses, and then multiply that by 100 to obtain the percentage each month.
   
