name: Percentage of lidocaine 100mg/10ml (1%) not issued as ready-to-administer pre-filled syringes # Full name of the measure/indicator
short_name: Ready-to-administer lidocaine 100mg/10ml (1%)  # Abbreviated name or acronym
description: Percentage of lidocaine 100mg/10ml (1%) not issued as ready-to-administer pre-filled syringes (PFS). # Brief 1-2 sentence description of what this measure identifies
why_it_matters: |
    [Lord Carter’s Transforming NHS Pharmacy Aseptic Services 
    in England review](https://assets.publishing.service.gov.uk/media/5f9afdbdd3bf7f1e405d9a23/aseptic-pharmacy.pdf) highlighted the need to expand the use of licensed ready-to-administer products. These products offer a safer and more efficient alternative to products that require preparation before use.
how_is_it_calculated: |
    We divide the number of [unit doses](/faq/#unit-dose) of injectable lidocaine 1% issued as ampoules by the total number of 
    unit doses of injectable lidocaine 1% issued. We then multiply that by 100 to obtain the % each month.

