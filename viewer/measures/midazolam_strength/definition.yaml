name: High strength midazolam # Full name of the measure/indicator
short_name: High strength midazolam # Abbreviated name or acronym
description: Percentage of high strength midazolam of all midazolam products # Brief 1-2 sentence description of what this measure identifies
why_it_matters: |  
    Midazolam is available in different concentrations, and selecting a high-strength preparation instead of the intended low-strength preparation can result in accidental overdose. 
    
    [The mis-selection of high strength midazolam during conscious sedation](https://www.england.nhs.uk/wp-content/uploads/2020/11/2018-Never-Events-List-updated-February-2021.pdf) is catergorised as an NHS Never Event. 
    
    To reduce the risk of mis-selection, high-strength midazolam (5 mg/mL in 2 mL and 10 mL ampoules, or 2 mg/mL in 5 mL ampoules) should only be used in restricted clinical areas such as general anaesthesia, intensive care, palliative care, or areas where its use has been formally risk-assessed in the organisation. 
    
    In other clinical areas, low strength midazolam (1mg/ml in 2ml or 5ml ampoules) is preferred. This is listed, amongst other actions, in the [National Patient Safety Agency (NPSA) Rapid Response Report](https://webarchive.nationalarchives.gov.uk/ukgwa/20180501212054/http://www.nrls.npsa.nhs.uk/resources/search-by-audience/hospital-nurse/?entryid45=59896&cord=DESC&p=8&char=0-9) to minimise availability of high-strength preparations to reduce harm.
how_is_it_calculated: |
    Midazolam products are identified using [Virtual Therapeutic Moiety (VTM)](/faq/#what-is-a-vtm) codes. These products are
    then filtered to only include injectable midazolam products (excluding oromucosal injections). These products are assigned 
    to the numerator if their strength is not 2mg/2ml or 5ml/5ml. The total number of [unit doses](https://hospitals.openprescribing.net/faq/#what-is-unit-dose-quantity) 
    of high strength injectable midazolam is divided by the total number of unit doses of all injectable midazolam products and 
    then multiplied by 100 to obtain a percentage each month. 
