name: Percentage of adrenaline (1 in 10,000) not issued as ready-to-administer pre-filled syringes # Full name of the measure/indicator
short_name: Ready-to-administer adrenaline (1 in 10,000) # Abbreviated name or acronym
description: Percentage of adrenaline (1 in 10,000) not issued as ready-to-administer pre-filled syringes (PFS). # Brief 1-2 sentence description of what this measure identifies
why_it_matters: |
    [Lord Carter’s Transforming NHS Pharmacy Aseptic Services 
    in England review](https://assets.publishing.service.gov.uk/media/5f9afdbdd3bf7f1e405d9a23/aseptic-pharmacy.pdf) highlighted the need to expand the use of licensed ready-to-administer products. These products offer a safer and more efficient alternative to products that require preparation before use.
how_is_it_calculated: |
    We divide the number of [unit doses](/faq/#unit-dose) of injectable adrenaline (1 in 10,000) issued as ampoules by the total number of 
    unit doses of injectable adrenaline (1 in 10,000) issued. We then multiply that by 100 to obtain the % each month.    
tags:
    # List relevant categories (e.g. Safety, Prescribing, Monitoring)
    - Efficiency
    - Ready-to-administer
quantity_type: dose # Type of measurement (e.g. dose, ingredient, ddd)
y_axis_label: '% adrenaline not in PFS'
lower_is_better: true
