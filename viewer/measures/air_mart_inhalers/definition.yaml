name: AIR/MART inhalers # Full name of the measure/indicator
short_name: AIR/MART inhalers # Abbreviated name or acronym
description: Percentage of corticosteroid containing inhaler doses that are for inhalers not licensed for MART/AIR therapy # Brief 1-2 sentence description of what this measure identifies
why_it_matters: |
    The [BTS/NICE/SIGN guidance](https://www.nice.org.uk/guidance/ng245/) published in November 2024 made significant changes to recommendations for asthma management. 
    For the majority of patients, [it recommends](https://www.nice.org.uk/guidance/ng245/chapter/Recommendations#principles-of-pharmacological-treatment) use of a combined inhaled corticosteroid (ICS) and formoterol under an AIR (anti-inflammatory reliever) or MART (maintenance and reliever therapy) regimen.  
how_is_it_calculated: |
    We divide the number of doses of corticosteroid containing inhalers not licensed for AIR/MART therapy by the total number of corticosteroid containing inhaler doses and then multiply that by 100 to obtain the % each month. 
    This measure is based on inhalers licensed for AIR and/or MART. The following inhalers are included in the non-AIR/MART group:

    - all non-formoterol ICS/LABA combination inhalers, as these are not suitable for AIR/MART
    - high-dose ICS/formoterol inhalers, which are licensed for maintenance therapy only

    Some inhalers may be used off-label for AIR/MART in clinical practice. However, for the purposes of this measure, they are included in the non-AIR/MART group.

    We exclude triple therapy inhalers from the measure, as they are more commonly used in COPD.
