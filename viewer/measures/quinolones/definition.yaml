name: Quinolones as a proportion of all antibiotics
short_name: Quinolones as a proportion of all antibiotics
short_description: 
  The percentage of oral or parenteral antibiotics issued as quinolones.
why_it_matters: |
  MHRA alert. Side effects
how_is_it_calculated: >
  We identify oral anticoagulant products using Virtual Therapeutic Moiety (VTM) codes. We then
  divide the number of [Defined Daily Doses (DDDs)](/faq/#what-is-a-defined-daily-dose-ddd) for
  VKAs (warfarin, acenocoumarol and phenindione) by the total number of DDDs for
  all included oral anticoagulants (VKAs plus DOACs) and multiply by 100 to
  obtain a percentage each month. Rivaroxaban initiation packs are excluded because they do not
  have a comparable DDD allocation.
tags:
