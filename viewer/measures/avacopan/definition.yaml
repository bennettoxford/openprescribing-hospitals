name: Withdrawal of Avacopan Vifor
short_name: Avacopan Vifor
description: Total count of avacopan vifor capsules issued.
why_it_matters: |
    Avacopan vifor, in combination with a rituximab or cyclophosphamide regimen, is indicated for adults with severe, active granulomatosis with polyangiitis (GPA) or microscopic polyangiitis (MPA) which are rare autoimmune diseases affecting small blood vessels.
    
    The Medicines and Healthcare products Regulatory Agency (MHRA) has [completed its review of avacopan vifor](https://www.gov.uk/government/news/mhra-concludes-review-of-avacopan-vifor-following-reassessment-of-benefit-risk-balance). The MHRA determined that the available evidence no longer supports a positive benefit-risk balance.

    The review followed questions about the integrity and reliability of data from the pivotal clinical study. The MHRA concluded that the study can no longer be relied upon to demonstrate the efficacy of avacopan vifor.

    From 1 September 2026, the MHRA suspended the use, supply, and sale of avacopan vifor to new patients. Supply is permitted only to existing patients during a six-month managed withdrawal period. The MHRA intends to revoke the UK marketing authorisation on 1 March 2027.

    Healthcare professionals should not start avacopan vifor in new patients. They should review patients who currently receive the medicine and consider alternative treatment where necessary. Patients should not stop treatment without discussion with their specialist.

how_is_it_calculated: >
    We display the total [SCMD quantity](/faq/#scmd-quantity) of all avacopan products issued. This measure has no denominator.
